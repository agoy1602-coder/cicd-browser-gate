name: CD - Verify Deployed URL

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Exact deployed application URL to verify"
        required: true
        type: string
      deployment_sha:
        description: "Exact 40-character Git commit SHA that produced this deployment"
        required: true
        type: string

  deployment_status:

  # Synthetic smoke monitoring after release. Configure the repository variable
  # PRODUCTION_BASE_URL to enable it; no URL is guessed.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify-deployed:
    name: Verify deployed application in real Chromium
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment_status.environment_url != '' ||
          github.event.deployment_status.target_url != ''
        )
      ) ||
      (
        github.event_name == 'schedule' &&
        vars.PRODUCTION_BASE_URL != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve and validate deployment target
        id: target
        env:
          MANUAL_URL: ${{ inputs.deployment_url }}
          MANUAL_SHA: ${{ inputs.deployment_sha }}
          EVENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          EVENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          EVENT_DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          SCHEDULED_PRODUCTION_URL: ${{ vars.PRODUCTION_BASE_URL }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import urlsplit

          candidates = [
              os.environ.get("MANUAL_URL", ""),
              os.environ.get("EVENT_ENVIRONMENT_URL", ""),
              os.environ.get("EVENT_TARGET_URL", ""),
              os.environ.get("SCHEDULED_PRODUCTION_URL", ""),
          ]
          value = next((candidate.strip() for candidate in candidates if candidate.strip()), "")
          sha = (
              os.environ.get("MANUAL_SHA", "").strip()
              or os.environ.get("EVENT_DEPLOYMENT_SHA", "").strip()
              or os.environ.get("WORKFLOW_SHA", "").strip()
          )

          if not value:
              raise SystemExit(
                  "No deployment URL available. Provide one manually, use a deployment status event, "
                  "or configure repository variable PRODUCTION_BASE_URL."
              )
          if any(ord(char) < 32 or char.isspace() for char in value):
              raise SystemExit("Deployment URL must not contain whitespace or control characters.")

          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("Deployment URL must be a complete HTTPS URL.")
          if parsed.username or parsed.password:
              raise SystemExit("Deployment URL must not contain embedded credentials.")
          if parsed.query or parsed.fragment:
              raise SystemExit("Supply a base URL without a query string or fragment.")
          if parsed.port not in (None, 443):
              raise SystemExit("Only the default HTTPS port is accepted.")
          hostname = parsed.hostname.rstrip(".").lower()
          if hostname == "localhost" or hostname.endswith((".localhost", ".local", ".internal")):
              raise SystemExit("Local or internal hostnames are not valid deployment targets.")
          try:
              ipaddress.ip_address(hostname)
          except ValueError:
              pass
          else:
              raise SystemExit("Use a public DNS hostname, not an IP address.")
          if "." not in hostname:
              raise SystemExit("Deployment hostname must be a public DNS hostname.")

          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("Deployment source must resolve to an exact 40-character Git commit SHA.")

          # URL has been checked for embedded newlines/control characters before writing outputs.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"url={value}\n")
              output.write(f"sha={sha.lower()}\n")
          print(f"Deployment URL validated for host: {hostname}")
          print(f"Deployment source commit: {sha.lower()}")
          PY

      - name: Checkout exact deployed source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Confirm checked-out commit
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "Checked-out source SHA does not match deployment source SHA."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $actual"
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # setup-node v5.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check deployed HTTP response with retries
        env:
          DEPLOYMENT_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --max-redirs 5 \
            --connect-timeout 10 --max-time 45 \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$DEPLOYMENT_URL" -o /tmp/deployed.html
          test -s /tmp/deployed.html
          echo "Deployed URL returned a successful non-empty response."

      - name: Real Chromium deployed browser gate
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          CI: true
        run: npm run e2e

      - name: Write post-deployment diagnostic summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.target.outputs.url }}
          DEPLOYMENT_SHA: ${{ steps.target.outputs.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Post-deployment verification"
            echo
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo "- Deployment source commit: `$DEPLOYMENT_SHA`"
            echo "- Verification run: $WORKFLOW_URL"
            echo "- Trigger: ${{ github.event_name }}"
            echo
            echo "See the deployed-browser-gate-evidence artifact for Playwright reports, diagnostics, traces, screenshots, and video when available."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # upload-artifact v7.0.2
        with:
          name: deployed-browser-gate-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
