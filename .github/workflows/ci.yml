name: CI - Build + Real Chromium Browser Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit/API tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start built application
        env:
          PORT: 3000
          APP_VERSION: ci
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for application health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Real Chromium browser gate
        env:
          BASE_URL: http://127.0.0.1:3000
          CI: true
        run: npm run e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-gate-evidence
          path: |
            playwright-report/
            test-results/
            server.log
          if-no-files-found: ignore
      - name: Stop application
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
